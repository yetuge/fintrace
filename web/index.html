<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%fintrace.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#18766b" />
    <meta
      name="description"
      content="FinTrace · 基于 Pi Agent Runtime 的金融研究 Agent 工作台，统一管理智能体、工作区、会话、记忆、工具与任务。"
    />

    <!-- PWA iOS Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinTrace" />
    <link rel="apple-touch-icon" href="%BASE_URL%fintrace-180.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- iOS PWA 优化：保留自动识别控制（页面缩放已允许） -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />

    <!-- DM Sans: loaded locally via @font-face in globals.css -->

    <!-- 预热认证：AuthGuard 放行前整棵已登录子树都不渲染，若等入口 JS 执行后
         才发 /api/auth/me，这个 RTT 会和分片下载串行。这里在 HTML 解析阶段就
         发出请求，stores/auth.ts 一次性消费 window.__authPrewarm。 -->
    <script>
      var route = window.location.pathname.slice('%BASE_URL%'.length);
      if (
        route === '' ||
        /^(chat|login|register|setup|agent-profiles|tasks|settings|capabilities|memory|monitor|users|usage|billing)(\/|$)/.test(
          route,
        )
      )
        window.__authPrewarm = fetch('%BASE_URL%api/auth/me', {
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
        }).catch(function () {
          return null;
        });
    </script>

    <title>FinTrace · 多源金融研究 Agent</title>
  </head>
  <body>
    <script>
      (function () {
        var d = document.documentElement,
          s =
            localStorage.getItem('miniclaw-theme') ||
            localStorage.getItem('miniclaw-theme');
        if (
          s === 'dark' ||
          (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        )
          d.classList.add('dark');
        var c =
          localStorage.getItem('miniclaw-color-scheme') ||
          localStorage.getItem('miniclaw-color-scheme');
        if (c === 'orange') d.classList.add('theme-orange');
        if (c === 'neutral') d.classList.add('theme-neutral');
        if (
          (localStorage.getItem('miniclaw-font-style') ||
            localStorage.getItem('miniclaw-font-style')) === 'anthropic'
        )
          d.classList.add('font-anthropic');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
